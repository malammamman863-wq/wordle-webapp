<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--tg-theme-bg-color, #1a1a1a);
            color: var(--tg-theme-text-color, #ffffff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .header {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            font-size: 13px;
            opacity: 0.6;
        }
        
        .board {
            display: grid;
            grid-template-rows: repeat(6, 1fr);
            gap: 6px;
            margin: 20px 0;
            max-width: 350px;
        }
        
        .row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        
        .cell {
            width: 60px;
            height: 60px;
            border: 2px solid #3a3a3a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        .cell.filled {
            border-color: #6c5ce7;
            animation: pop 0.1s ease-out;
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .cell.correct {
            background: #6c5ce7;
            border-color: #6c5ce7;
            color: white;
        }
        
        .cell.present {
            background: #f0b90b;
            border-color: #f0b90b;
            color: white;
        }
        
        .cell.absent {
            background: #3a3a3a;
            border-color: #3a3a3a;
            color: white;
        }
        
        .cell.flip {
            animation: flip 0.5s ease;
        }
        
        @keyframes flip {
            0% { transform: rotateX(0); }
            50% { transform: rotateX(90deg); }
            100% { transform: rotateX(0); }
        }
        
        .keyboard {
            max-width: 400px;
            width: 100%;
            margin-top: 20px;
        }
        
        .keyboard-row {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 6px;
        }
        
        .key {
            background: #4a4a4a;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 15px 0;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            min-width: 30px;
            flex: 1;
            max-width: 45px;
            text-transform: uppercase;
            transition: all 0.15s;
            font-family: inherit;
        }
        
        .key:active {
            transform: scale(0.95);
            background: #5a5a5a;
        }
        
        .key.wide {
            max-width: 70px;
            flex: 1.5;
            font-size: 12px;
        }
        
        .key.correct {
            background: #6c5ce7;
        }
        
        .key.present {
            background: #f0b90b;
        }
        
        .key.absent {
            background: #2a2a2a;
            opacity: 0.5;
        }
        
        .message {
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            min-height: 40px;
            max-width: 350px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .message.show {
            opacity: 1;
        }
        
        .message.win {
            background: rgba(108, 92, 231, 0.2);
            color: #6c5ce7;
            border: 1px solid #6c5ce7;
        }
        
        .message.lose {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid #e74c3c;
        }
        
        .message.error {
            background: rgba(240, 185, 11, 0.2);
            color: #f0b90b;
            border: 1px solid #f0b90b;
        }
        
        .new-game-btn {
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #6c5ce7, #00cec9);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: none;
        }
        
        .new-game-btn.show {
            display: block;
        }
        
        .new-game-btn:active {
            transform: scale(0.95);
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 13px;
            opacity: 0.7;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 20px;
            font-weight: bold;
            display: block;
        }
    </style>
</head>

            "уклад", "уклон", "укол", "уксус", "улика", "улица", "улов", "улыбка", "умение", "унисон",
            "упор", "управа", "ураган", "урожай", "урок", "урон", "усадьба", "услуга", "успех", "устав",
            "утес", "уход", "участок", "ученик", "учет", "учитель", "ушко", "ущелье", "уют", "фабрика",
            "фазан", "факел", "факт", "фамилия", "фанат", "фантом", "фара", "фарфор", "фасад", "фасоль",
            "фауна", "февраль", "ферма", "фестиваль", "фигура", "физика", "фиалка", "фибра", "фикция", "филин",
            "фильм", "финал", "финик", "фирма", "флаг", "фланг", "флейта", "флора", "флот", "фокус",
            "фонарь", "фонд", "фонтан", "форма", "форум", "фото", "фраза", "фрак", "фронт", "фрукт",
            "футбол", "футляр", "халат", "халва", "характер", "хвост", "хижина", "хирург", "хит", "хищник",
            "хлеб", "хлопок", "хобби", "хобот", "ход", "хозяин", "хоккей", "холм", "холод", "холст",
            "хомут", "хор", "хорек", "хребет", "хрип", "хроника", "хрусталь", "художник", "хутор", "цапля",
            "царство", "царь", "цвет", "цель", "цемент", "центр", "цепь", "цикл", "цилиндр", "цирк",
            "цитата", "цифра", "цыган", "чайка", "часть", "часы", "чашка", "челнок", "человек", "чемпион",
            "червяк", "череп", "черта", "чеснок", "честь", "четверг", "число", "чистота", "чтец", "чтение",
            "чугун", "чудак", "чудо", "чулан", "чулок", "чучело", "шабаш", "шаг", "шайба", "шалаш",
            "шампунь", "шанс", "шапка", "шарик", "шарф", "шасси", "шатер", "шахта", "шахматы", "шашлык",
            "швейцар", "шедевр", "шелест", "шелк", "шепот", "шерсть", "шкаф", "школа", "шкура", "шланг",
            "шлюпка", "шляпа", "шнур", "шов", "шоссе", "шофер", "шпага", "шпион", "шрифт", "штаб",
            "штамм", "штора", "штраф", "штрих", "штурм", "штука", "шуба", "шум", "шутка", "щегол",
            "щедрость", "щека", "щель", "щенок", "щетка", "щипцы", "щит", "эскиз", "эссе", "этаж",
            "этап", "этикет", "этюд", "эфир", "эхо", "юбилей", "юбка", "юмор", "юнга", "юрист",
            "яхта", "яблоко", "ягода", "ядро", "язык", "яйцо", "якорь", "яма", "январь", "ярлык",
            "ярмарка", "ясень", "ясность", "яхонт", "ячмень", "ящик"
        ];
        
        // Состояние игры
        let secretWord = '';
        let currentRow = 0;
        let currentCol = 0;
        let currentGuess = '';
        let gameOver = false;
        let stats = JSON.parse(localStorage.getItem('wordle_stats') || '{"games":0,"wins":0,"streak":0,"bestStreak":0}');
        
        // Инициализация
        function init() {
            createBoard();
            createKeyboard();
            updateStats();
            startNewGame();
        }
        
        function createBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            for (let r = 0; r < 6; r++) {
                const row = document.createElement('div');
                row.className = 'row';
                row.id = `row-${r}`;
                
                for (let c = 0; c < 5; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `cell-${r}-${c}`;
                    row.appendChild(cell);
                }
                
                board.appendChild(row);
            }
        }
        
        function createKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            
            const rows = [
                ['й', 'ц', 'у', 'к', 'е', 'н', 'г', 'ш', 'щ', 'з', 'х', 'ъ'],
                ['ф', 'ы', 'в', 'а', 'п', 'р', 'о', 'л', 'д', 'ж', 'э'],
                ['enter', 'я', 'ч', 'с', 'м', 'и', 'т', 'ь', 'б', 'ю', 'backspace']
            ];
            
            rows.forEach(row => {
                const rowDiv = document.createElement('div');
                rowDiv.className = 'keyboard-row';
                
                row.forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'key';
                    btn.dataset.key = key;
                    
                    if (key === 'enter') {
                        btn.textContent = 'ВВОД';
                        btn.classList.add('wide');
                    } else if (key === 'backspace') {
                        btn.textContent = '⌫';
                        btn.classList.add('wide');
                    } else {
                        btn.textContent = key.toUpperCase();
                    }
                    
                    btn.addEventListener('click', () => handleKeyPress(key));
                    rowDiv.appendChild(btn);
                });
                
                keyboard.appendChild(rowDiv);
            });
        }
        
        function startNewGame() {
            secretWord = WORDS[Math.floor(Math.random() * WORDS.length)];
            currentRow = 0;
            currentCol = 0;
            currentGuess = '';
            gameOver = false;
            
            // Очищаем поле
            for (let r = 0; r < 6; r++) {
                for (let c = 0; c < 5; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    cell.textContent = '';
                    cell.className = 'cell';
                }
            }
            
            // Очищаем клавиатуру
            document.querySelectorAll('.key').forEach(key => {
                key.classList.remove('correct', 'present', 'absent');
            });
            
            hideMessage();
            document.getElementById('newGameBtn').classList.remove('show');
            
            console.log('Загаданное слово:', secretWord); // Для отладки
        }
        
        function handleKeyPress(key) {
            if (gameOver) return;
            
            if (key === 'enter') {
                submitGuess();
            } else if (key === 'backspace') {
                if (currentCol > 0) {
                    currentCol--;
                    currentGuess = currentGuess.slice(0, -1);
                    const cell = document.getElementById(`cell-${currentRow}-${currentCol}`);
                    cell.textContent = '';
                    cell.classList.remove('filled');
                }
            } else if (currentCol < 5) {
                currentGuess += key;
                const cell = document.getElementById(`cell-${currentRow}-${currentCol}`);
                cell.textContent = key.toUpperCase();
                cell.classList.add('filled');
                currentCol++;
            }
        }
        
        function submitGuess() {
            if (currentGuess.length !== 5) {
                showMessage('Введи 5 букв!', 'error');
                return;
            }
            
            // Проверяем результат
            const result = checkGuess(currentGuess, secretWord);
            
            // Анимируем клетки
            for (let c = 0; c < 5; c++) {
                const cell = document.getElementById(`cell-${currentRow}-${c}`);
                setTimeout(() => {
                    cell.classList.add('flip');
                    setTimeout(() => {
                        cell.classList.add(result[c]);
                    }, 250);
                }, c * 100);
            }
            
            // Обновляем клавиатуру
            for (let c = 0; c < 5; c++) {
                const key = document.querySelector(`.key[data-key="${currentGuess[c]}"]`);
                if (key) {
                    if (result[c] === 'correct') {
                        key.classList.remove('present', 'absent');
                        key.classList.add('correct');
                    } else if (result[c] === 'present' && !key.classList.contains('correct')) {
                        key.classList.remove('absent');
                        key.classList.add('present');
                    } else if (result[c] === 'absent' && !key.classList.contains('correct') && !key.classList.contains('present')) {
                        key.classList.add('absent');
                    }
                }
            }
            
            // Проверяем победу/проигрыш
            setTimeout(() => {
                if (currentGuess === secretWord) {
                    // Победа
                    gameOver = true;
                    stats.games++;
                    stats.wins++;
                    stats.streak++;
                    if (stats.streak > stats.bestStreak) stats.bestStreak = stats.streak;
                    saveStats();
                    updateStats();
                    showMessage(`🎉 Победа! Слово: ${secretWord.toUpperCase()}`, 'win');
                    document.getElementById('newGameBtn').classList.add('show');
                    
                    // Отправляем в Telegram
                    if (tg.sendData) {
                        tg.sendData(JSON.stringify({
                            action: 'win',
                            word: secretWord,
                            tries: currentRow + 1
                        }));
                    }
                } else if (currentRow === 5) {
                    // Проигрыш
                    gameOver = true;
                    stats.games++;
                    stats.streak = 0;
                    saveStats();
                    updateStats();
                    showMessage(`😢 Проигрыш! Слово было: ${secretWord.toUpperCase()}`, 'lose');
                    document.getElementById('newGameBtn').classList.add('show');
                } else {
                    // Продолжаем
                    currentRow++;
                    currentCol = 0;
                    currentGuess = '';
                }
            }, 500);
        }
        
        function checkGuess(guess, secret) {
            const result = ['absent', 'absent', 'absent', 'absent', 'absent'];
            const secretArr = secret.split('');
            const guessArr = guess.split('');
            
            // Первый проход: точные позиции
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] === secretArr[i]) {
                    result[i] = 'correct';
                    secretArr[i] = null;
                    guessArr[i] = null;
                }
            }
            
            // Второй проход: буквы не на своих местах
            for (let i = 0; i < 5; i++) {
                if (guessArr[i] !== null) {
                    const index = secretArr.indexOf(guessArr[i]);
                    if (index !== -1) {
                        result[i] = 'present';
                        secretArr[index] = null;
                    }
                }
            }
            
            return result;
        }
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = `message show ${type}`;
        }
        
        function hideMessage() {
            const msg = document.getElementById('message');
            msg.className = 'message';
        }
        
        function updateStats() {
            document.getElementById('statGames').textContent = stats.games;
            document.getElementById('statWins').textContent = stats.wins;
            document.getElementById('statStreak').textContent = stats.streak;
        }
        
        function saveStats() {
            localStorage.setItem('wordle_stats', JSON.stringify(stats));
        }
        
        // Обработка физической клавиатуры
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleKeyPress('enter');
            } else if (e.key === 'Backspace') {
                handleKeyPress('backspace');
            } else if (e.key.length === 1 && /[а-яё]/i.test(e.key)) {
                handleKeyPress(e.key.toLowerCase());
            }
        });
        
        // Кнопка новой игры
        document.getElementById('newGameBtn').addEventListener('click', () => {
            startNewGame();
        });
        
        // Запуск
        init();
    </script>
